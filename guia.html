<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Guía Vulcan Tread</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: una sola columna tipo cartilla de planta; inicio = tablero de fichas grandes, cada ficha abre un paso a paso con foto real de la pantalla */
:root{
  --bg:#eef0f3; --surface:#ffffff; --ink:#15181d; --muted:#5b6370; --line:#d5d9e0;
  --orange:#e2690f; --orange-soft:#fde9d9; --blue:#1d4f91; --blue-soft:#e3ecf8;
  --ok:#15803d; --ok-soft:#dcf3e3; --bad:#c62828; --bad-soft:#fbe4e4;
  /* colores de los botones reales del sistema, iguales en los dos temas */
  --b-blue:#2563eb; --b-green:#16a34a; --b-dark:#0f172a; --b-red:#dc2626; --b-grey:#e9edf3; --b-grey-ink:#1f2937; --b-white:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1b1f26; --ink:#eef1f5; --muted:#a3abb8; --line:#2f3540;
  --orange:#f28a3a; --orange-soft:#3a2615; --blue:#8db4ea; --blue-soft:#1b2a40;
  --ok:#5cc983; --ok-soft:#163222; --bad:#f07a7a; --bad-soft:#3a1c1c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1b1f26; --ink:#eef1f5; --muted:#a3abb8; --line:#2f3540;
  --orange:#f28a3a; --orange-soft:#3a2615; --blue:#8db4ea; --blue-soft:#1b2a40;
  --ok:#5cc983; --ok-soft:#163222; --bad:#f07a7a; --bad-soft:#3a1c1c; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05;letter-spacing:.01em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* banda de dibujo de banda de rodamiento */
.tread{height:14px;border-radius:7px;background:
  repeating-linear-gradient(115deg,var(--ink) 0 10px,transparent 10px 22px),
  repeating-linear-gradient(65deg,var(--ink) 0 10px,transparent 10px 22px);
  background-size:44px 7px,44px 7px;background-position:0 0,22px 7px;background-repeat:repeat-x;opacity:.85}

header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.logo{background:#fff;border-radius:10px;padding:6px 10px;display:flex}
.logo img{height:52px;width:auto;display:block}
.top h1{font-size:clamp(34px,6vw,52px);font-weight:800;text-transform:uppercase}
.top p{margin:2px 0 0;color:var(--muted)}
.estado{display:flex;gap:12px;align-items:flex-start;background:var(--orange-soft);border:2px solid var(--orange);border-radius:var(--r);padding:12px 16px;margin:14px 0 22px}
.estado b{color:var(--orange)}

.seccion-tit{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ficha{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:var(--r);padding:14px;min-height:96px;transition:transform .12s,border-color .12s}
.ficha:hover{border-color:var(--orange);transform:translateY(-2px)}
.ficha .num{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:32px;background:var(--ink);color:var(--bg);position:relative}
.ficha .num::after{content:"";position:absolute;inset:5px;border-radius:50%;border:3px dashed var(--bg);opacity:.45}
.ficha b{display:block;font-family:var(--f-display);font-size:25px;line-height:1.05;font-weight:700}
.ficha small{display:block;color:var(--muted);font-size:15px;margin-top:3px}
.quien{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue);margin-top:6px}
.ficha.extra .num{background:var(--orange);color:#fff}
.ficha.extra .num::after{border-color:#fff}

/* vista de una lección */
.vista{display:grid;gap:16px}
.barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.volver{background:var(--surface);border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700}
.volver:hover{border-color:var(--ink)}
.vista h2{font-size:clamp(32px,5vw,46px);font-weight:800;text-transform:uppercase}
.puntos{display:flex;gap:6px;flex-wrap:wrap}
.punto{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:14px;display:grid;place-items:center;padding:0}
.punto.hecho{background:var(--ok);border-color:var(--ok);color:#fff}
.punto.aca{background:var(--b-blue);border-color:var(--b-blue);color:#fff}
.paso{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px}
.paso.sinfoto{grid-template-columns:minmax(0,1fr)}
.paso .cuenta{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.paso h3{font-size:clamp(30px,4.4vw,40px);font-weight:800;margin:4px 0 10px}
.paso p{margin:0 0 12px;max-width:60ch}
.paso ul{margin:0 0 12px;padding-left:22px;display:grid;gap:6px}
.toca{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:6px 0 12px}
.toca > span{font-weight:700;color:var(--muted);font-size:15px;text-transform:uppercase;letter-spacing:.08em}
.br{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:10px 16px;font-weight:700;font-size:17px;border:2px solid transparent;font-family:Arial,Helvetica,sans-serif;white-space:nowrap}
.br.azul{background:var(--b-blue);color:#fff}.br.verde{background:var(--b-green);color:#fff}.br.negro{background:var(--b-dark);color:#fff}
.br.rojo{background:var(--b-red);color:#fff}.br.gris{background:var(--b-grey);color:var(--b-grey-ink);border-color:#cfd6e0}
.br.borde{background:var(--b-white);color:var(--b-grey-ink);border-color:#cfd6e0}
.br.borde-verde{background:var(--b-white);color:#15803d;border-color:var(--b-green)}
.ojo{display:flex;gap:10px;background:var(--bad-soft);border-left:6px solid var(--bad);border-radius:8px;padding:10px 14px;font-size:16px}
.ojo b{color:var(--bad)}
.tip{display:flex;gap:10px;background:var(--ok-soft);border-left:6px solid var(--ok);border-radius:8px;padding:10px 14px;font-size:16px}
.foto{margin:0;align-self:start}
.foto button{border:2px solid var(--line);border-radius:12px;padding:0;background:var(--bg);overflow:hidden;display:block;width:100%}
.foto img{display:block;width:100%;height:auto}
.foto figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.nav{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.nav button{flex:1 1 200px;min-height:64px;border-radius:14px;font-family:var(--f-display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.ant{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.sig{background:var(--orange);color:#fff;border:2px solid var(--orange)}
.sig:hover{filter:brightness(1.07)}
.ant:disabled{opacity:.4;cursor:default}
.fin{background:var(--ok-soft);border:2px solid var(--ok);border-radius:var(--r);padding:20px;display:grid;gap:12px}
.fin h3{font-size:36px;color:var(--ok)}
.fin .fichas{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

/* zoom de foto */
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.zoom img{max-width:100%;max-height:88vh;border-radius:10px;background:#fff}
.zoom button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));background:#fff;color:#111;border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:18px}

/* tarjetas: reglas, palabras */
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.regla{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px}
.regla .n{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;color:var(--orange)}
.regla b{font-size:20px;line-height:1.25}
.regla span{color:var(--muted);font-size:16px}
.palabra{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;min-height:130px;text-align:left;color:var(--ink);display:grid;align-content:center;gap:6px}
.palabra b{font-family:var(--f-display);font-size:30px;line-height:1}
.palabra .def{font-size:17px}
.palabra .pista{font-size:14px;color:var(--muted)}
.palabra[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}

/* prueba */
.preg{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px}
.preg h3{font-size:30px}
.opc{display:grid;gap:8px}
.opc button{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:18px}
.opc button.bien{background:var(--ok-soft);border-color:var(--ok)}
.opc button.mal{background:var(--bad-soft);border-color:var(--bad)}
.resp{font-size:16px}
.marcador{font-family:var(--f-display);font-size:28px;font-weight:700}

/* falta */
.lista-falta{display:grid;gap:8px}
.item{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.item input{width:28px;height:28px;margin:2px 0 0;accent-color:var(--b-green)}
.item b{display:block}
.item small{color:var(--muted);font-size:15px}
.item .tag{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--orange-soft);color:var(--orange)}
.item.ok{opacity:.55}.item.ok b{text-decoration:line-through}

/* historia */
.hist{display:grid;gap:0;border-left:4px solid var(--ink);margin-left:12px}
.dia{position:relative;padding:0 0 18px 24px}
.dia::before{content:"";position:absolute;left:-12px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--orange);border:4px solid var(--bg)}
.dia h3{font-size:26px}
.dia ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px;font-size:17px}

.tabla{overflow-x:auto;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.tabla table{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
.tabla th,.tabla td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tabla th{font-family:var(--f-display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tabla td.n{text-align:right;white-space:nowrap}
.tabla tr.neg td{color:var(--bad);font-weight:700}
.mono{font-family:Consolas,"Courier New",monospace;font-size:.9em;background:var(--bg);padding:1px 6px;border-radius:6px;word-break:break-all}
.copiar{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--ink);margin-left:6px}

@media (max-width:720px){
  .paso{grid-template-columns:minmax(0,1fr);padding:16px}
  body{font-size:17px}
  .tabla th,.tabla td{padding:6px 8px;font-size:14px}
  .tabla th{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

 {id:"boleta", n:1, t:"Cargo la boleta del cliente", s:"Los cascos que trae el cliente. Al grabar queda su orden de trabajo.", q:"Oficina · PC", pasos:[
  {h:"Entrá a Producción", p:["En el menú de la izquierda tocá <b>Producción por cubierta</b>."], b:[["gris","Producción por cubierta"]]},
  {h:"Abrí la carga de cascos", p:["Arriba hay pestañas. Tocá la primera."], b:[["azul","1 · Carga de cascos"]]},
  {h:"Elegí el cliente", p:["Escribí una parte del nombre. Aparece una lista: <b>tocá el cliente</b>.","No se escribe a mano: el cliente siempre sale de la lista."]},
  {h:"Poné el número de la boleta", p:["Es el número de la boleta de papel que trajo el cliente."], ojo:"Una boleta no se puede cargar dos veces. Si ya está, sale un aviso en rojo y no deja grabar."},
  {h:"Un renglón por cada casco", p:["En cada renglón elegí, en este orden:"], ul:["<b>Tipo</b>: CAMION","<b>Medida</b>: por ejemplo 275/80R22.5","<b>Marca</b> del casco: MICHELIN, BRIDGESTONE…","<b>Trabajo</b>: RECAPADO, VULCANIZADO…"], tip:"El número azul (CHA000015) es la marca grabada. La pone el sistema solo. Si el casco tiene DOT, escribilo encima.", img:"boleta"},
  {h:"¿Trajo más cascos?", p:["Tocá <b>Otro casco</b>. El renglón nuevo copia los datos del anterior y solo cambiás lo distinto."], b:[["borde","+ Otro casco"]]},
  {h:"Grabá la boleta", p:["Tocá <b>Grabar boleta</b>. Arriba aparece en verde: <b>Grabada la OT-00028</b>. Esa es la orden de trabajo (OT) del cliente."], b:[["azul","Grabar boleta"]], img:"grabada"},
  {h:"Imprimí la orden de trabajo", p:["Tocá <b>Imprimir la orden de trabajo</b>. Se abre la hoja con el logo.","<b>Imprimir</b> la manda a la impresora. <b>Guardar PDF</b> baja el archivo para mandarlo por WhatsApp."], b:[["azul","Imprimir la orden de trabajo"]], img:"ot_print"}
 ]},
 {id:"carga", n:2, t:"Armo la carga de 15", s:"Se juntan las cubiertas que entran juntas a la línea y al autoclave.", q:"Encargado · PC", pasos:[
  {h:"Abrí la orden de servicio", p:["En Producción por cubierta tocá la pestaña 3. Ahí están todas las cubiertas que esperan, de todos los clientes."], b:[["azul","3 · Orden de servicio"]]},
  {h:"Tildá las que entran", p:["Tildá la casilla <b>Entra</b> de cada cubierta. Hasta <b>15</b> en camión. Pueden ser de clientes distintos."], ul:["<b>Titular</b>: entra seguro.","<b>Suplente</b>: entra solo si falla una titular."], img:"os_tildar"},

 ["5 al 16 de octubre","Cascos, orden de trabajo e inspección",["05/10: motivos de rechazo y control semanal de lo que se entrega al personal.","05/10: nuevo recorrido: carga de cascos → orden de trabajo → orden de servicio → inspección en la tablet.","06/10: manual de producción.","10 al 13/10: todo el proyecto documentado y respaldado en la carpeta (mapa del sistema, qué hay y dónde).","16/10: seguridad revisada, carpeta ordenada y una sola base de datos activa."]],

 ["21/10","Autoclave, control y reproceso",["Autoclave por carga con mapa de lugares.","Control del encargado: OK, volver a una estación o rechazo final.","Trabajos extra en la inspección.","Stock real cargado: 194 artículos.","La línea no para (otro insumo con stock). Stock nunca negativo.","Boleta con OT automática y marca grabada automática.","Retiro y devolución de insumos por estación, banda reutilizada, herramental por número."]],
 ["22/10","Impresiones, ayuda y precios",["Imprimir y guardar PDF de OT, OS e informe final, con logo.","Ayuda en cada pantalla y recorrido guiado.","Relojes de trabajo guardados en el servidor, varios a la vez.","La tablet trabaja una carga a la vez; acceso directo a estaciones.","Lista de precios de cubiertas nuevas para vendedores, cotización por WhatsApp y PDF, listas 10 a 30%.","Estudio de precios y margen mínimo."]],
 ["23/10","Cobro y catálogo",["Precios solo con IVA incluido.","Cómo cobrar según el medio de pago.","Catálogo Vulcan Tread en PDF e interactivo con carrito."]],
 ["24/10","Versión 25, probada y publicada",["Vulcanizado solo (sin estaciones 2, 6 y 7, sin banda).","Cantidad obligatoria en insumos a medir: solo un SUPER la saltea.","Insumo fuera de receta y botón Todo como la receta.","Remito por cliente al cerrar la carga.","Informe con costo de rechazos.","Prueba completa con un SUPER y con un operario. Datos de prueba anulados.","Publicada para todos. Esta guía queda en el sitio.","El catálogo manda los pedidos al WhatsApp de Gustavo, encargado de ventas."]]
];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var app = document.getElementById("app");
var estado = {vista:"inicio", lec:null, paso:0, puntos:{}};
var hechos = {};
try { hechos = JSON.parse(localStorage.getItem("guia_falta") || "{}") || {}; } catch(e) { hechos = {}; }

function cabecera(){
  return '<header class="top"><div class="logo"><img src="'+LOGO+'" alt="Vulcan Tread Neumáticos"></div><div><h1>Guía del sistema</h1><p>Cómo se trabaja en Vulcan Tread. Tocá lo que hacés vos.</p></div></header><div class="tread" aria-hidden="true"></div>';
}
function ficha(l, extra){
  return '<button class="ficha'+(extra?' extra':'')+'" data-ir="'+l.id+'"><span class="num">'+esc(String(l.n))+'</span><span><b>'+esc(l.t)+'</b><small>'+esc(l.s)+'</small>'+(l.q?'<span class="quien">'+esc(l.q)+'</span>':'')+'</span></button>';
}
function inicio(){
  var h = cabecera();
  h += '<div class="estado"><div><b>Cómo está hoy.</b> La línea de camiones quedó probada completa el 24/10/2026, de la boleta al remito impreso. Ya está publicada: todos entran al mismo link y ven lo que explica esta guía.</div></div>';
  h += '<div class="seccion-tit">La línea de camiones, en orden</div><div class="fichas">';
  LECCIONES.slice(0,7).forEach(function(l){ h += ficha(l); });
  h += '</div><div class="seccion-tit">Ventas y precios</div><div class="fichas">';
  LECCIONES.slice(7).forEach(function(l){ h += ficha(l); });
  h += '</div><div class="seccion-tit">Para saber más</div><div class="fichas">';
  EXTRAS.forEach(function(l){ h += ficha(l, true); });
  h += '</div>';
  app.innerHTML = h;
}
function barra(titulo){
  return '<div class="barra" style="margin-bottom:12px"><button class="volver" data-ir="inicio">← Volver al inicio</button></div><h2>'+esc(titulo)+'</h2><div style="height:10px"></div>';
}
function boton(b){ return '<span class="br '+b[0]+'">'+esc(b[1])+'</span>'; }
function tabla(t){
  var h = '<div class="tabla"><table><thead><tr>';
  t.c.forEach(function(c,i){ h += '<th'+(i>0?' style="text-align:right"':'')+'>'+esc(c)+'</th>'; });
  h += '</tr></thead><tbody>';
  t.r.forEach(function(r){ h += '<tr'+(r[r.length-1]===1?' class="neg"':'')+'>'; r.forEach(function(c,i){ if (c===1) return; h += '<td'+(i>0?' class="n"':'')+'>'+esc(c)+'</td>'; }); h += '</tr>'; });
  return h + '</tbody></table></div>';
}
function leccion(){
  var l = LECCIONES.filter(function(x){return x.id===estado.lec;})[0];
  var total = l.pasos.length, i = estado.paso;
  var h = barra(l.t) + '<div class="puntos" role="list">';
  for (var k=0;k<=total;k++){
    var cls = k<i ? 'hecho' : (k===i ? 'aca' : '');
    h += '<button class="punto '+cls+'" data-paso="'+k+'" aria-label="'+(k<total?'Paso '+(k+1):'Final')+'">'+(k<total?(k<i?'✓':(k+1)):'★')+'</button>';
  }
  h += '</div><div style="height:14px"></div>';
  if (i >= total){
    var sig = LECCIONES.filter(function(x){return x.n===l.n+1;})[0];
    h += '<div class="fin"><h3>¡Listo! Ya sabés «'+esc(l.t)+'»</h3><p>Si te olvidás de algo, volvé a esta ficha.</p><div class="fichas">'+(sig?ficha(sig):'')+ficha(EXTRAS[1],true)+'</div></div>';
    h += '<div class="nav"><button class="ant" data-mover="-1">← Atrás</button><button class="sig" data-ir="inicio">Inicio</button></div>';
    app.innerHTML = h; return;
  }
  var p = l.pasos[i];
  h += '<section class="paso'+(p.img?'':' sinfoto')+'"><div><div class="cuenta">Paso '+(i+1)+' de '+total+' · '+esc(l.q)+'</div><h3>'+esc(p.h)+'</h3>';
  (p.p||[]).forEach(function(x){ h += '<p>'+x+'</p>'; });
  if (p.ul) h += '<ul>'+p.ul.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
  if (p.link) h += '<p><span class="mono" id="lk">'+esc(p.link)+'</span><button class="copiar" data-copiar="https://'+esc(p.link)+'">Copiar</button></p>';
  if (p.arch) h += '<p>Archivo: <span class="mono">'+esc(p.arch)+'</span></p>';
  if (p.b) h += '<div class="toca"><span>Tocá</span>'+p.b.map(boton).join('')+'</div>';
  if (p.tabla) h += tabla(p.tabla);
  if (p.tip) h += '<div class="tip" style="margin-top:12px"><span>✔</span><div>'+p.tip+'</div></div>';
  if (p.ojo) h += '<div class="ojo" style="margin-top:12px"><b>Ojo</b><div>'+p.ojo+'</div></div>';
  h += '</div>';
  if (p.img) h += '<figure class="foto"><button data-zoom="'+p.img+'" aria-label="Ver la foto grande"><img src="'+IMG[p.img]+'" alt="Pantalla real del sistema: '+esc(p.h)+'"></button><figcaption>Pantalla real de la prueba del 24/10. Tocala para verla grande.</figcaption></figure>';
  h += '</section><div class="nav"><button class="ant" data-mover="-1"'+(i===0?' disabled':'')+'>← Atrás</button><button class="sig" data-mover="1">'+(i===total-1?'Terminar ✓':'Siguiente →')+'</button></div>';
  app.innerHTML = h;
}
function reglas(){
  var h = barra('Reglas que no se rompen') + '<p>El sistema las controla solo. No dependen de que alguien se acuerde.</p><div class="tarjetas">';
  REGLAS.forEach(function(r,i){ h += '<div class="regla"><span class="n">'+(i+1)+'</span><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>'; });
  app.innerHTML = h + '</div>';
}
function prueba(){
  var h = barra('Probá si entendiste'), bien = 0, resp = 0;
  PREGUNTAS.forEach(function(q,i){ var e = estado.puntos[i]; if (e!==undefined){ resp++; if (e===q.ok) bien++; } });
  h += '<div class="marcador">'+bien+' bien de '+PREGUNTAS.length+(resp===PREGUNTAS.length?(bien===PREGUNTAS.length?' · ¡Perfecto!':' · Mirá las que salieron en rojo'):'')+'</div>';
  PREGUNTAS.forEach(function(q,i){
    var e = estado.puntos[i];
    h += '<div class="preg"><h3>'+(i+1)+'. '+esc(q.q)+'</h3><div class="opc">';
    q.o.forEach(function(o,j){ var c = e===undefined ? '' : (j===q.ok ? 'bien' : (j===e ? 'mal' : '')); h += '<button class="'+c+'" data-resp="'+i+'-'+j+'">'+esc(o)+'</button>'; });
    h += '</div>'+(e!==undefined?'<div class="resp">'+(e===q.ok?'✔ Bien. ':'✘ No. ')+esc(q.r)+'</div>':'')+'</div>';
  });
  h += '<div class="nav"><button class="ant" data-reset="1">Empezar de nuevo</button><button class="sig" data-ir="inicio">Inicio</button></div>';
  app.innerHTML = h;
}
function falta(){
  var h = barra('Lo que falta') + '<p>Son datos para cargar o cosas para decidir. El programa ya está. Tildalas cuando estén hechas (queda guardado solo en este aparato).</p><div class="lista-falta">';
  FALTA.forEach(function(f,i){ var ok = !!hechos[i]; h += '<label class="item'+(ok?' ok':'')+'" for="f'+i+'"><input type="checkbox" id="f'+i+'" data-falta="'+i+'"'+(ok?' checked':'')+'><span><b>'+esc(f[0])+'<span class="tag">'+(f[2]==='dato'?'cargar':'decidir')+'</span></b><small>'+esc(f[1])+'</small></span></label>'; });
  app.innerHTML = h + '</div>';
}
function palabras(){
  var h = barra('Palabras que usamos') + '<p>Tocá una palabra para ver qué quiere decir.</p><div class="tarjetas">';
  PALABRAS.forEach(function(p,i){ var on = !!estado.puntos['w'+i]; h += '<button class="palabra" aria-pressed="'+on+'" data-pal="'+i+'"><b>'+esc(p[0])+'</b>'+(on?'<span class="def">'+esc(p[1])+'</span>':'<span class="pista">Tocá para ver</span>')+'</button>'; });
  app.innerHTML = h + '</div>';
}
function historia(){
  var h = barra('Línea de tiempo del sistema') + '<p>Cómo empezó todo y cómo se llegó hasta hoy, en orden. Lo de arriba es lo más viejo.</p><div class="hist">';
  HISTORIA.forEach(function(d){ h += '<div class="dia"><h3>'+esc(d[0])+' · '+esc(d[1])+'</h3><ul>'+d[2].map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'; });
  app.innerHTML = h + '</div>';
}
function pintar(){
  var v = estado.vista;
  if (v==='inicio') inicio(); else if (v==='lec') leccion(); else if (v==='reglas') reglas(); else if (v==='prueba') prueba(); else if (v==='falta') falta(); else if (v==='palabras') palabras(); else if (v==='historia') historia();
}
function ir(id){
  if (id==='inicio'){ estado.vista='inicio'; }
  else if (LECCIONES.some(function(l){return l.id===id;})){ estado.vista='lec'; estado.lec=id; estado.paso=0; }
  else { estado.vista=id; }
  try { history.replaceState(null,'',id==='inicio'?' ':'#'+id); } catch(e) {}
  pintar(); window.scrollTo(0,0);
}
app.addEventListener('click', function(ev){
  var t = ev.target.closest('button,input'); if (!t) return;
  if (t.dataset.ir){ ir(t.dataset.ir); return; }
  if (t.dataset.mover){ var l = LECCIONES.filter(function(x){return x.id===estado.lec;})[0]; estado.paso = Math.max(0, Math.min(l.pasos.length, estado.paso + Number(t.dataset.mover))); pintar(); window.scrollTo(0,0); return; }
  if (t.dataset.paso){ estado.paso = Number(t.dataset.paso); pintar(); return; }
  if (t.dataset.zoom){ var z = document.createElement('div'); z.className='zoom'; z.innerHTML='<button type="button">Cerrar ✕</button><img src="'+IMG[t.dataset.zoom]+'" alt="Pantalla grande">'; z.addEventListener('click', function(){ z.remove(); }); document.body.appendChild(z); return; }
  if (t.dataset.resp){ var a = t.dataset.resp.split('-'); if (estado.puntos[a[0]]===undefined){ estado.puntos[a[0]] = Number(a[1]); pintar(); } return; }
  if (t.dataset.reset){ Object.keys(estado.puntos).forEach(function(k){ if (/^\d+$/.test(k)) delete estado.puntos[k]; }); pintar(); return; }
  if (t.dataset.pal){ var k='w'+t.dataset.pal; estado.puntos[k] = !estado.puntos[k]; pintar(); return; }
  if (t.dataset.copiar){ var txt = t.dataset.copiar; var hecho = function(){ t.textContent='Copiado'; }; try { navigator.clipboard.writeText(txt).then(hecho, function(){ seleccionar(); }); } catch(e){ seleccionar(); } return; }
  if (t.dataset.falta !== undefined){ hechos[t.dataset.falta] = t.checked; try { localStorage.setItem('guia_falta', JSON.stringify(hechos)); } catch(e) {} pintar(); return; }
});
function seleccionar(){ var el = document.getElementById('lk'); if (!el) return; var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener('keydown', function(e){
  var z = document.querySelector('.zoom'); if (z && e.key==='Escape'){ z.remove(); return; }
  if (estado.vista!=='lec') return;
  if (e.key==='ArrowRight'){ var b=document.querySelector('[data-mover="1"]'); if(b) b.click(); }
  if (e.key==='ArrowLeft'){ var a=document.querySelector('[data-mover="-1"]'); if(a && !a.disabled) a.click(); }
});
(function(){ var h = (location.hash||'').replace('#',''); if (h && (LECCIONES.some(function(l){return l.id===h;}) || EXTRAS.some(function(x){return x.id===h;}))) ir(h); else pintar(); })();
</script>
