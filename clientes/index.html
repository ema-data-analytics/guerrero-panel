.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-height:150px;justify-content:center;text-align:center}

.load{padding:40px 0;text-align:center;color:var(--dim);font-size:14px}

<body>
<div id="raiz"></div>
<script>
/* App de clientes · Vulcan Tread (27/11/2026). Solo lectura de la flota de la empresa + botón de emergencia.
   Todo pasa por la función gs del sistema con el pase de sesión del usuario (rol CLIENTE_APP). */
var CL = { ses: null, tab: 'ini', data: {}, eq: '', ver: '', emg: null, cub: null, pend: null };
var CL_PV = '99990000000000';
var CL_KEY = 'vulcan_cli_ses';
var QUE_PASO = ['Pinchadura', 'Reventón', 'No arranca', 'Falla mecánica', 'Falla eléctrica', 'Choque', 'Otro'];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fch(ms) { if (!ms) return ''; var d = new Date(Number(ms)); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear(); }
function hora(ms) { if (!ms) return ''; var d = new Date(Number(ms)); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function nf(n) { if (n === '' || n === null || n === undefined || isNaN(Number(n))) return ''; return Number(n).toLocaleString('es-AR'); }
function dot(d) { return d ? esc(d) : '<span style="color:var(--dim)">sin cargar</span>'; }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function toast(t, ms) { var el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(function() { el.remove(); }, ms || 3200); }

// ── Servidor ──
function llamar(fn, args) {
  return fetch(EMA_SB.url + '/functions/v1/gs', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: EMA_SB.key },
    body: JSON.stringify({ esquema: EMA_SB.esquema, v: EMA_SB.v || '', pv: CL_PV, fn: fn, args: args }) })
    .then(function(r) { return r.text().then(function(t) { var d = null; try { d = JSON.parse(t); } catch (e) { throw new Error('No hay conexión con Vulcan (' + r.status + ')'); }
      if (!d || d.ok !== true) throw new Error((d && d.error) || 'Error del servidor'); return d.r === undefined ? null : d.r; }); },
      function() { throw new Error('Sin conexión: revisá la señal'); });
}
function api(fn, d) {
  if (!CL.ses) return Promise.reject(new Error('SESION'));
  var x = d || {}; if (CL.ver) x.VER = CL.ver;
  return llamar('gsApi', [CL.ses.token, fn, [x]]).then(function(r) {
    if (r && r.ok === false) throw new Error(r.error || 'No se pudo');
    return r;
  }).catch(function(e) {
    var m = String(e.message || e);
    if (m.indexOf('SESION:') !== -1) { salir(m.substring(m.indexOf('SESION:') + 7).trim() || 'Tu sesión terminó: entrá de nuevo'); throw new Error('SESION'); }
    throw new Error(m.replace(/^PERMISO:\s*/, ''));
  });
}

// ── Entrada ──
function pintarLogin(msg) {
  $('raiz').innerHTML = '<form class="login" onsubmit="entrar(event)"><img src="../logo_vulcan.png" alt="Vulcan Tread">' +
    '<h1>Mi flota en Vulcan</h1><div class="s" style="text-align:center">Mecánica, gomería y precurado de tus vehículos</div>' +
    (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
    '<div class="fld"><label for="lg-u">Usuario</label><input class="in" id="lg-u" autocomplete="username" autocapitalize="none" required></div>' +
    '<div class="fld"><label for="lg-p">Contraseña</label><input class="in" id="lg-p" type="password" autocomplete="current-password" required></div>' +
    '<button class="btn btn-p" id="lg-b">Entrar</button>' +
    '<div class="s" style="text-align:center">¿No tenés usuario? Pedíselo a Vulcan Tread.</div></form>';
}
function entrar(ev) {
  ev.preventDefault(); var b = $('lg-b'); b.disabled = true; b.textContent = 'Entrando…';
  llamar('gsLogin', [$('lg-u').value.trim(), $('lg-p').value]).then(function(r) {
    if (!r || !r.ok) { pintarLogin((r && r.error) || 'Usuario o contraseña incorrectos'); return; }
    var rol = String(r.rol || '').toUpperCase();
    if (rol !== 'CLIENTE_APP' && rol !== 'SUPER' && rol !== 'ADMINISTRADOR') { pintarLogin('Ese usuario es del sistema de Vulcan: entrá por sistema.vulcantreadsrl.com.ar'); return; }
    CL.ses = { token: r.token, nombre: r.nombre, rol: rol, usuario: r.usuario };
    lsSet(CL_KEY, JSON.stringify(CL.ses)); arrancar();
  }).catch(function(e) { pintarLogin(e.message); });
}
function salir(msg) { CL.ses = null; CL.data = {}; CL.ver = ''; lsSet(CL_KEY, null); lsSet('vulcan_cli_ver', null); pintarLogin(msg || ''); }
function esAdmin() { return CL.ses && CL.ses.rol !== 'CLIENTE_APP'; }

function arrancar() {
  if (esAdmin() && !CL.ver) { CL.ver = lsGet('vulcan_cli_ver') || ''; if (!CL.ver) { elegirEmpresa(); return; } }
  pintarMarco(); ir(CL.tab || 'ini');
}
// Vista previa para Vulcan: SUPER y ADMINISTRADOR eligen qué empresa ver
function elegirEmpresa() {
  $('raiz').innerHTML = '<div class="app"><div class="hd"><div class="top"><h1>Ver la app como…</h1><button class="cta" onclick="salir()">Salir</button></div><div class="sub">Vista previa para Vulcan: elegí la empresa</div></div><div class="body" id="emp"><div class="load">Cargando empresas…</div></div></div>';
  llamar('gsApi', [CL.ses.token, 'gsCLI_Empresas', [{}]]).then(function(r) {
    CL.emps = r.EMPRESAS || [];
    $('emp').innerHTML = '<input class="in" id="emp-q" placeholder="🔎 Buscar empresa…" oninput="empFiltrar()" autocomplete="off"><div class="card" id="emp-l"></div>';
    empFiltrar(); $('emp-q').focus();
  }).catch(function(e) { $('emp').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
function empFiltrar() {
  var q = ($('emp-q').value || '').toUpperCase().trim(), l = (CL.emps || []).filter(function(e) { return !q || e.NOMBRE.toUpperCase().indexOf(q) !== -1; });
  $('emp-l').innerHTML = l.length ? l.map(function(e) { return '<button class="row" style="width:100%;background:none;border:0;text-align:left;cursor:pointer" onclick="verEmpresa(' + e.ID + ')"><div class="rowb"><span class="t">' + esc(e.NOMBRE) + '</span><span class="s">' + e.UNIDADES + ' unidades</span></div></button>'; }).join('') : '<div class="pad s">Ninguna empresa con «' + esc(q) + '»</div>';
}
function verEmpresa(id) { CL.ver = String(id); lsSet('vulcan_cli_ver', CL.ver); CL.data = {}; CL.eq = ''; pintarMarco(); ir('ini'); }

// ── Marco: barra de abajo y botones de emergencia ──
var ICO = {
  ini: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',
  mec: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>',
  gom: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v5.5M12 15.5V21M3 12h5.5M15.5 12H21"/></svg>',
  pre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="2"/></svg>'
};
function pintarMarco() {
  $('raiz').innerHTML = '<div class="app"><div id="vista"></div></div>' +
    '<div class="emg" id="emg"><button class="bt-verde mini" onclick="abrirDetalle()" aria-label="Mandar mensaje al mecánico" title="Mandar mensaje al mecánico">' + icoMsg() + '</button>' +
    '<button class="bt-rojo mini" id="bt-rojo" aria-label="Emergencia: mantené apretado 2 segundos" title="Emergencia: mantené apretado 2 segundos"><i class="fill"></i><span>⚠</span></button></div>' +
    '<nav class="nav"><div class="in2">' + [['ini', 'Inicio'], ['mec', 'Mecánica'], ['gom', 'Gomería'], ['pre', 'Precurado']].map(function(t) {
      return '<button id="nv-' + t[0] + '" onclick="ir(\'' + t[0] + '\')">' + ICO[t[0]] + '<span>' + t[1] + '</span><span class="bad" id="bd-' + t[0] + '" hidden></span></button>'; }).join('') + '</div></nav>';
  armarRojo($('bt-rojo'));
}
// Burbuja de mensaje (genérica: no es el logo de WhatsApp)
function icoMsg() { return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 19.5 5.3 15A8 8 0 1 1 9 18.7z"/></svg>'; }
function marcoVisible(si) { var e = $('emg'), n = document.querySelector('.nav'); if (e) e.style.display = si ? '' : 'none'; if (n) n.style.display = si ? '' : 'none'; }
function cabecera(tit, sub, back) {
  if (!back && CL.tab !== 'ini' && tit !== 'Ver la app como…') return '<div class="hd"><button class="back" onclick="ir(\'ini\')">‹ Inicio</button><div class="top"><h1>' + esc(tit) + '</h1><button class="cta" onclick="cuenta()">' + (esAdmin() ? 'Vista previa' : 'Mi cuenta') + '</button></div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  return '<div class="hd"><div class="top">' + (back ? '' : '<h1>' + esc(tit) + '</h1><button class="cta" onclick="cuenta()">' + (esAdmin() ? 'Vista previa' : 'Mi cuenta') + '</button>') + '</div>' +
    (back ? '<button class="back" onclick="' + back + '">‹ Volver</button><h1>' + esc(tit) + '</h1>' : '') + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
}
function ir(tab) {
  CL.tab = tab; marcoVisible(true); window.scrollTo(0, 0);
  var em = $('emg'); if (em) em.style.display = tab === 'ini' ? 'none' : '';
  ['ini', 'mec', 'gom', 'pre'].forEach(function(t) { var b = $('nv-' + t); if (b) b.className = t === tab ? 'on' : ''; });

    var EP = { TERMINADA: 'Recapado terminado en la planta Vulcan', RECHAZADA: 'Rechazada en la inspección de la planta', EN_OT: 'En producción en la planta Vulcan', EN_ESPERA: 'Recibida en la planta Vulcan' };
    (r.PROD || []).forEach(function(x) { if (!EP[x.ESTADO]) return; hist.push({ F: x.F, T: EP[x.ESTADO] + (x.TRABAJO ? ' · ' + esc(x.TRABAJO) : '') }); });
    hist.sort(function(a, b) { return b.F - a.F; });
    h += '<div class="h2">Historia</div>' + (hist.length ? '<div class="card">' + hist.map(function(x) { return '<div class="row" style="display:grid;grid-template-columns:82px 1fr;gap:10px"><span class="s num">' + fch(x.F) + '</span><span style="font-size:13.5px">' + x.T + '</span></div>'; }).join('') + '</div>' : '<div class="card pad s">Sin movimientos registrados.</div>');
    if ((r.MONTAJES || []).length) h += '<div class="h2">Dónde anduvo</div><div class="card">' + r.MONTAJES.slice().reverse().map(function(m) { return '<div class="row"><div class="rowb"><span class="t">' + esc(m.UNIDAD) + ' · ' + esc(m.POS) + '</span><span class="s num">' + nf(m.KM) + ' km</span></div><span class="s">' + fch(m.DESDE) + ' → ' + (m.HASTA ? fch(m.HASTA) : 'hoy') + '</span></div>'; }).join('') + '</div>';
    $('vista').innerHTML = h + '</div>';
  }).catch(function(e) { fallo('Cubierta', e); });
}

// ── Precurado ──
var PASOS = ['Recibida', 'Inspección', 'Producción', 'Autoclave', 'Lista'];
function vPrecurado() {
  cargando('Precurado', 'Tus cubiertas recapadas en Vulcan');
  api('gsCLI_Precurado', {}).then(function(r) {
    var h = cabecera('Precurado', 'Tus cubiertas recapadas en Vulcan') + '<div class="body">';
    h += '<div class="kpis"><div class="kpi"><span>En la planta</span><b>' + r.EN_PLANTA.length + '</b></div><div class="kpi"><span>Terminadas (30 días)</span><b style="color:var(--ok)">' + r.LISTAS + '</b></div>' +
      '<div class="kpi"><span>En el último recapado</span><b style="color:' + (r.AL_MAXIMO.length ? 'var(--warn)' : 'var(--fg)') + '">' + (r.RECAP_MAX === '' ? '–' : r.AL_MAXIMO.length) + '</b></div></div>';
    h += '<div class="h2">En la planta ahora</div>';
    if (!r.EN_PLANTA.length) h += '<div class="card pad s">No tenés cubiertas en la planta.</div>';
    else h += '<div class="card">' + r.EN_PLANTA.map(function(c) {
      return '<div class="row" style="gap:6px"><div class="rowb"><span class="t">Marca grabada ' + esc(c.MARCA) + '</span><span class="s">DOT ' + dot(c.DOT) + '</span></div>' +
        '<div class="steps">' + PASOS.map(function(p, k) { return '<i class="' + (k + 1 < c.PASO ? 'd' : k + 1 === c.PASO ? 'c' : '') + '"></i>'; }).join('') + '</div>' +
        '<span class="s">' + PASOS.map(function(p, k) { return k + 1 === c.PASO ? '<b style="color:var(--fg)">' + p + '</b>' : p; }).join(' → ') + '<br>' + esc(c.ETAPA) + ' · ' + esc([c.MEDIDA, c.TRABAJO].filter(Boolean).join(' · ')) + ' · recibida el ' + fch(c.F_REC) + '</span></div>'; }).join('') + '</div>';
    if (r.AL_MAXIMO.length) h += '<div class="h2">Avisos de recapado</div><div class="aviso g1" style="cursor:default"><i class="dot"></i><span>' + r.AL_MAXIMO.length + (r.AL_MAXIMO.length === 1 ? ' cubierta ya lleva' : ' cubiertas ya llevan') + ' ' + r.RECAP_MAX + ' recapados o más, el máximo para su casco. La próxima vez van a cambio.</span></div>' +
      '<div class="card">' + r.AL_MAXIMO.map(function(c) { return '<button class="row" style="width:100%;background:none;border:0;text-align:left;cursor:pointer" onclick="verCubierta(' + c.ID_CASCO + ')"><div class="rowb"><span class="t">Marca grabada ' + esc(c.MARCA) + '</span><span class="tag tg-w">' + c.RECAP + ' recapados</span></div><span class="s">DOT ' + dot(c.DOT) + ' · ' + esc(c.MEDIDA) + '</span></button>'; }).join('') + '</div>';
    if (r.RECHAZADAS.length) h += '<div class="h2">Rechazadas (90 días)</div><div class="card">' + r.RECHAZADAS.map(function(c) { return '<div class="row"><div class="rowb"><span class="t">Marca grabada ' + esc(c.MARCA) + '</span><span class="s num">' + fch(c.F) + '</span></div><span class="s">DOT ' + dot(c.DOT) + ' · ' + esc(c.MEDIDA) + (c.MOTIVO ? '<br>Motivo: ' + esc(c.MOTIVO) : '') + '</span></div>'; }).join('') + '</div>';
    h += '<div class="h2">Terminadas (90 días)</div>' + (r.TERMINADAS.length ? '<div class="card">' + r.TERMINADAS.map(function(c) { return '<button class="row" style="width:100%;background:none;border:0;text-align:left;cursor:' + (c.ID_CASCO ? 'pointer' : 'default') + '"' + (c.ID_CASCO ? ' onclick="verCubierta(' + c.ID_CASCO + ')"' : '') + '><div class="rowb"><span class="t">Marca grabada ' + esc(c.MARCA) + '</span><span class="s num">' + fch(c.F) + '</span></div><span class="s">DOT ' + dot(c.DOT) + ' · ' + esc([c.MEDIDA, c.TRABAJO].filter(Boolean).join(' · ')) + '</span></button>'; }).join('') + '</div>' : '<div class="card pad s">Sin cubiertas terminadas en los últimos 90 días.</div>');
    $('vista').innerHTML = h + '</div>';
  }).catch(function(e) { fallo('Precurado', e); });
}

// ── Emergencia ──
// Botón rojo: hay que mantenerlo apretado 2 segundos (para que no salga sin querer en el bolsillo)
function armarRojo(b) {
  if (!b) return; var t0 = 0, raf = 0, fill = b.querySelector('.fill');
  var parar = function() { t0 = 0; cancelAnimationFrame(raf); if (fill) fill.style.width = '0'; var o = $('hold'); if (o) o.remove(); };
  var paso = function() { if (!t0) return; var p = Math.min(1, (Date.now() - t0) / 2000); if (fill) fill.style.width = (p * 100) + '%'; var c = $('hold-c'); if (c) c.setAttribute('stroke-dashoffset', String(440 * (1 - p)));
    if (p >= 1) { parar(); if (navigator.vibrate) navigator.vibrate(200); mandarAlerta(); return; } raf = requestAnimationFrame(paso); };
  b.addEventListener('pointerdown', function(e) { e.preventDefault(); t0 = Date.now(); try { b.setPointerCapture(e.pointerId); } catch (x) {}
    var o = document.createElement('div'); o.className = 'hold'; o.id = 'hold'; o.innerHTML = '<svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="70" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/><circle id="hold-c" cx="75" cy="75" r="70" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="440" transform="rotate(-90 75 75)"/></svg><b>Seguí apretando…</b><span>Soltá para cancelar</span>';
    document.body.appendChild(o); raf = requestAnimationFrame(paso); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function(ev) { b.addEventListener(ev, parar); });
  b.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  b.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (confirmarTeclado()) mandarAlerta(); } });
}
function confirmarTeclado() { return true; }
function ubicacion(ms) {
  return new Promise(function(res) {
    if (!navigator.geolocation) { res(null); return; }
    var listo = false, fin = function(v) { if (!listo) { listo = true; res(v); } };
    setTimeout(function() { fin(null); }, ms || 8000);
    navigator.geolocation.getCurrentPosition(function(p) { fin({ LAT: p.coords.latitude, LNG: p.coords.longitude, PREC: Math.round(p.coords.accuracy) }); }, function() { fin(null); }, { enableHighAccuracy: true, timeout: ms || 8000, maximumAge: 60000 });
  });
}
function opKey() { return 'C' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function mandarAlerta() {
  marcoVisible(false); window.scrollTo(0, 0);
  $('vista').innerHTML = '<div class="alerta"><h1>Mandando la alerta…</h1><div>Buscando tu ubicación</div></div><div class="body"><div class="load">Un momento</div></div>';
  var k = CL.pend && CL.pend.OP_KEY ? CL.pend.OP_KEY : opKey();
  ubicacion(8000).then(function(u) {
    var d = { OP_KEY: k, ID_EQUIPO: CL.eq || '' }; if (u) { d.LAT = u.LAT; d.LNG = u.LNG; d.PREC = u.PREC; }
    CL.pend = d;
    return api('gsCLI_Alerta', d).then(function(r) { CL.pend = null; CL.emg = r; verAlerta(u); });
  }).catch(function(e) {
    if (String(e.message) === 'SESION') return;
    $('vista').innerHTML = '<div class="alerta"><h1>No salió la alerta</h1><div>' + esc(e.message) + '</div></div><div class="body">' +
      '<button class="btn btn-r" onclick="mandarAlerta()">Probar de nuevo</button>' + llamarFijo() + '<button class="btn btn-l" onclick="ir(\'ini\')">Volver</button></div>';
  });
}
function llamarFijo() { var t = CL.data.ini && CL.data.ini.TEL_VULCAN; return t ? '<a class="btn btn-l" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="tel:' + esc(String(t).replace(/[^\d+]/g, '')) + '">📞 Llamar a Vulcan</a>' : ''; }
function verAlerta(u) {
  var e = CL.emg; if (!e) { ir('ini'); return; }
  marcoVisible(false); window.scrollTo(0, 0);
  var sal = e.WA === 'ENVIADO', cerr = e.ESTADO === 'CANCELADA' || e.ESTADO === 'RESUELTA';
  var h = '<div class="alerta" style="' + (cerr ? 'background:var(--head)' : '') + '"><div class="lab" style="color:#ffd9d4">EMERGENCIA ' + esc(e.NRO) + ' · ' + hora(e.F) + '</div><h1>' + (cerr ? (e.ESTADO === 'RESUELTA' ? 'Resuelta' : 'Cancelada') : e.ESTADO === 'EN_CAMINO' ? 'El mecánico va en camino' : sal ? 'Alerta enviada' : 'Alerta registrada') + '</h1>' +
    '<div>' + (cerr ? '' : sal ? 'Le llegó al mecánico de guardia por WhatsApp, con tu ubicación. Te va a llamar.' : e.WA === 'FALLO' ? 'Quedó registrada en Vulcan, pero el WhatsApp no salió. Llamá a Vulcan.' : 'Quedó registrada en Vulcan. El aviso por WhatsApp todavía no está conectado: llamá a Vulcan.') + '</div></div><div class="body">';
  h += '<div class="card pad s">' + (e.LAT !== '' && e.LNG !== '' ? '📍 Ubicación enviada' + (u && u.PREC ? ' (precisión ' + u.PREC + ' m)' : '') : '📍 No se pudo tomar la ubicación: escribila en el mensaje al mecánico') + (e.F_DET ? '<br>Mensaje enviado: ' + esc(e.QUE_PASO) + (e.DETALLE ? ' · ' + esc(e.DETALLE) : '') : '') + '</div>';
  if (!cerr) {
    h += '<button class="btn btn-g" onclick="abrirDetalle(' + e.ID + ')">' + (e.F_DET ? 'Corregir el mensaje al mecánico' : 'Mandar mensaje al mecánico') + '</button>';
    if (!sal || e.WA === 'FALLO') h += llamarFijo();
    if (e.ESTADO !== 'EN_CAMINO') h += '<button class="btn btn-l" onclick="cancelarAlerta(' + e.ID + ')">Fue sin querer: cancelar</button>';
  }
  h += '<button class="btn btn-l" onclick="ir(\'ini\')">Volver al inicio</button><div class="s">No se muestran el nombre ni el teléfono del mecánico. Vulcan registra cada emergencia: cuándo llegó, quién la atendió y qué se hizo.</div></div>';
  $('vista').innerHTML = h;
}
function cancelarAlerta(id) {
  api('gsCLI_Cancelar', { ID: id }).then(function(r) { CL.emg = r; toast('Alerta cancelada'); verAlerta(); }).catch(function(e) { toast(e.message); });
}
// Botón verde: el detalle (si no hubo alerta antes, la crea con el detalle)
function abrirDetalle(id) {
  marcoVisible(false); window.scrollTo(0, 0);
  var e = id && CL.emg && String(CL.emg.ID) === String(id) ? CL.emg : null, vehs = (CL.data.ini && CL.data.ini.VEHICULOS) || [];
  var sel = e && e.QUE_PASO ? e.QUE_PASO : '';
  var h = '<div class="hd" style="background:var(--green)"><button class="back" style="color:#d6f3df" onclick="' + (e ? 'verAlerta()' : 'ir(\'ini\')') + '">‹ Volver</button><h1>Mandar mensaje al mecánico</h1><div class="sub" style="color:#d6f3df">Le llega al mecánico de guardia por WhatsApp y queda registrado en Vulcan</div></div>' +
    '<form class="body" onsubmit="enviarDetalle(event,' + (e ? e.ID : 0) + ')">';
  h += '<div class="fld"><label for="dt-u">¿Qué vehículo?</label><select class="in" id="dt-u"><option value="">Elegí</option>' + vehs.map(function(v) { var s = String((e && e.ID_EQUIPO) || CL.eq) === String(v.ID); return '<option value="' + v.ID + '"' + (s ? ' selected' : '') + '>' + esc(v.IDENT) + (v.MM ? ' · ' + esc(v.MM) : '') + '</option>'; }).join('') + '</select></div>';
  h += '<div class="fld"><label>¿Qué pasó?</label><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px" id="dt-q">' + QUE_PASO.map(function(q) { return '<button type="button" class="chip' + (q === sel ? ' on' : '') + '" style="border-radius:10px;height:46px" onclick="qp(this)">' + q + '</button>'; }).join('') + '</div></div>';
  h += '<div class="fld"><label for="dt-d">¿Dónde está?</label><input class="in" id="dt-d" placeholder="Ruta, km, ciudad" value="' + esc(e ? e.UBICACION : '') + '"></div>' +
    '<button type="button" class="btn btn-l" style="height:44px;border-style:dashed" onclick="tomarUbic(this)">📍 ' + (e && e.LAT !== '' ? 'Actualizar mi ubicación' : 'Mandar mi ubicación') + '</button><input type="hidden" id="dt-lat"><input type="hidden" id="dt-lng">';
  h += '<div class="fld"><label for="dt-t">Teléfono para que te llamen</label><input class="in" id="dt-t" type="tel" inputmode="tel" value="' + esc((e && e.TELEFONO) || lsGet('vulcan_cli_tel') || '') + '" required></div>' +
    '<div class="fld"><label for="dt-x">Algo más (opcional)</label><textarea class="in" id="dt-x" rows="3" placeholder="Rueda, ruido, lo que veas">' + esc(e ? e.DETALLE : '') + '</textarea></div>' +
    '<div id="dt-err"></div><button class="btn btn-g" id="dt-b">Mandar al mecánico</button>' +
    '<div class="s">No se muestran el nombre ni el teléfono del mecánico. Para una alerta inmediata usá el botón rojo.</div></form>';
  $('vista').innerHTML = h;
}
function qp(b) { Array.prototype.forEach.call($('dt-q').children, function(x) { x.className = 'chip'; }); b.className = 'chip on'; }
function tomarUbic(b) { b.textContent = '📍 Buscando…'; ubicacion(10000).then(function(u) { if (!u) { b.textContent = '📍 No se pudo: escribí dónde estás'; return; } $('dt-lat').value = u.LAT; $('dt-lng').value = u.LNG; b.textContent = '📍 Ubicación tomada (' + u.PREC + ' m)'; }); }
function enviarDetalle(ev, id) {
  ev.preventDefault(); var q = document.querySelector('#dt-q .chip.on'), b = $('dt-b'), er = $('dt-err');
  if (!q) { er.innerHTML = '<div class="err">Elegí qué pasó</div>'; return; }
  var d = { ID: id || '', ID_EQUIPO: $('dt-u').value, QUE_PASO: q.textContent, UBICACION: $('dt-d').value.trim(), LAT: $('dt-lat').value, LNG: $('dt-lng').value, TELEFONO: $('dt-t').value.trim(), DETALLE: $('dt-x').value.trim(), OP_KEY: id ? '' : opKey() };
  lsSet('vulcan_cli_tel', d.TELEFONO); b.disabled = true; b.textContent = 'Mandando…'; er.innerHTML = '';
  api('gsCLI_Detalle', d).then(function(r) { CL.emg = r; toast(r.WA === 'ENVIADO' ? 'Le llegó al mecánico' : 'Quedó registrado en Vulcan'); verAlerta(); })
    .catch(function(e) { b.disabled = false; b.textContent = 'Mandar al mecánico'; if (String(e.message) !== 'SESION') er.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}

// ── Cuenta ──
function cuenta() {
  marcoVisible(false); window.scrollTo(0, 0);
  var h = '<div class="hd"><button class="back" onclick="ir(CL.tab)">‹ Volver</button><h1>' + (esAdmin() ? 'Vista previa' : 'Mi cuenta') + '</h1><div class="sub">' + esc(CL.ses.nombre || CL.ses.usuario) + '</div></div><div class="body">';
  if (esAdmin()) h += '<div class="card pad s">Estás viendo la app como la ve la empresa. Solo los usuarios de Vulcan con rol SUPER o ADMINISTRADOR pueden hacerlo.</div><button class="btn btn-l" onclick="CL.ver=\'\';lsSet(\'vulcan_cli_ver\',null);CL.data={};CL.eq=\'\';elegirEmpresa()">Ver otra empresa</button>';
  else h += '<div class="h2">Cambiar contraseña</div><form class="card pad" style="display:flex;flex-direction:column;gap:10px" onsubmit="cambiarClave(event)"><div class="fld"><label for="ck-a">Contraseña actual</label><input class="in" id="ck-a" type="password" autocomplete="current-password" required></div>' +
    '<div class="fld"><label for="ck-n">Contraseña nueva</label><input class="in" id="ck-n" type="password" autocomplete="new-password" minlength="6" required></div><div id="ck-e"></div><button class="btn btn-p" id="ck-b">Guardar</button></form>' +
    '<div class="h2">Facturas y cuenta corriente</div><div class="card pad s">Muy pronto vas a ver acá tus facturas, remitos y el saldo.</div>';
  h += '<button class="btn btn-l" onclick="salir()">Salir</button><div class="s" style="text-align:center">Vulcan Tread Neumáticos S.R.L. · Salta</div></div>';
  $('vista').innerHTML = h;
}
function cambiarClave(ev) {
  ev.preventDefault(); var b = $('ck-b'); b.disabled = true;
  llamar('gsApi', [CL.ses.token, 'gsCambiarMiClave', [$('ck-a').value, $('ck-n').value]]).then(function(r) {
    b.disabled = false; if (r && r.ok === false) { $('ck-e').innerHTML = '<div class="err">' + esc(r.error) + '</div>'; return; } toast('Contraseña cambiada'); ir(CL.tab);
  }).catch(function(e) { b.disabled = false; $('ck-e').innerHTML = '<div class="err">' + esc(String(e.message).replace(/^PERMISO:\s*/, '')) + '</div>'; });
}

// ── Estado de una emergencia abierta: se vuelve a mirar cada 30 segundos ──
setInterval(function() {
  if (!CL.ses || document.hidden || !CL.emg || CL.emg.ESTADO === 'RESUELTA' || CL.emg.ESTADO === 'CANCELADA') return;
  api('gsCLI_Emergencias', {}).then(function(r) {
    var n = (r.ABIERTAS || []).filter(function(x) { return String(x.ID) === String(CL.emg.ID); })[0];
    if (!n) return; var cambio = n.ESTADO !== CL.emg.ESTADO || n.WA !== CL.emg.WA; CL.emg = n;
    if (cambio && n.ESTADO === 'EN_CAMINO') { toast('El mecánico va en camino', 5000); if (navigator.vibrate) navigator.vibrate([150, 80, 150]); }
    if (cambio && $('vista') && $('vista').querySelector('.alerta')) verAlerta();
  }).catch(function() {});
}, 30000);

(function() {
  var s = null; try { s = JSON.parse(lsGet(CL_KEY) || 'null'); } catch (e) { s = null; }
  if (s && s.token) { CL.ses = s; arrancar(); } else pintarLogin('');
})();
</script>
