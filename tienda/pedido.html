<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tu pedido · Vulcan Tread</title>
<link rel="icon" href="../logo_vulcan.png">
<style>
:root{--az:#14213d;--na:#E8792B;--bg:#f4f5f8;--sf:#fff;--tx:#1d2433;--mu:#6b7280;--li:#e3e6ec;--ok:#166534;--bad:#b91c1c}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
header{background:var(--az);color:#fff}.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px}
.hd .lg{background:#fff;border-radius:8px;padding:4px 8px;display:flex}.hd .lg img{height:34px}.hd b{font-size:15px}
main{max-width:720px;margin:0 auto;padding:16px}
.box{background:var(--sf);border:1px solid var(--li);border-radius:14px;padding:14px 16px;margin-bottom:12px}
h2{margin:0 0 4px;color:var(--az);font-size:20px}.mu{color:var(--mu);font-size:13px}
.est{display:inline-block;border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px;margin-top:6px}
.e1{background:#fff6ee;color:#c2410c}.e2{background:#e0f2fe;color:#075985}.e3{background:#dcfce7;color:#166534}.e4{background:#fee2e2;color:#b91c1c}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:7px 0;border-bottom:1px solid var(--li);vertical-align:top}td.n{text-align:right;white-space:nowrap;padding-left:8px}
.tt td{border:0;padding:3px 0}.tt .g td{font-size:19px;font-weight:800;color:var(--az);padding-top:6px}
.btn{display:block;width:100%;border:0;background:var(--az);color:#fff;border-radius:10px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;text-align:center;text-decoration:none;margin-top:8px}
.btn.o{background:var(--na)}.btn.w{background:#25d366}.btn.l{background:#fff;color:var(--az);border:1px solid var(--li)}.btn[disabled]{background:#cbd0d8}
.dato{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--li);border-radius:10px;padding:8px 10px;margin-top:6px}
.dato span{font-size:12px;color:var(--mu)}.dato b{font-size:16px;word-break:break-all}.dato button{border:1px solid var(--li);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
input{width:100%;padding:10px;border:1px solid var(--li);border-radius:10px;font-size:16px;margin-top:6px}
.err{color:var(--bad);font-weight:600;margin-top:6px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:20px}
</style>
</head>
<body>
<header><div class="hd"><div class="lg"><img src="../logo_vulcan.jpg" alt="Vulcan Tread"></div><b>Vulcan Tread Neumáticos</b></div></header>
<main id="m"><div class="box">Cargando tu pedido…</div></main>
<footer>Vulcan Tread Neumáticos S.R.L. · Salta · <a href="./">Volver a la tienda</a></footer>
<script>
var SB='https://igxdgivroxmbuolsdagk.supabase.co', KEY='sb_publishable_dgGGJ5PSVp9i4l7Up1r5yw_ADYBEt_G';
var T=(location.search.match(/[?&]t=([0-9a-f-]{36})/)||[])[1]||'', P=null;
function $(id){return document.getElementById(id);}
function pesos(n){return '$ '+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fecha(ms){var d=new Date(ms);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function post(url,body,cb){
  var x=new XMLHttpRequest();x.open('POST',url);x.setRequestHeader('apikey',KEY);x.setRequestHeader('Content-Type','application/json');x.timeout=25000;
  x.onload=function(){var r=null;try{r=JSON.parse(x.responseText);}catch(e){}if(x.status>=200&&x.status<300)cb(null,r);else cb((r&&(r.message||r.error))||('Error '+x.status));};
  x.onerror=function(){cb('Sin conexión');};x.ontimeout=function(){cb('La conexión tardó demasiado');};x.send(JSON.stringify(body||{}));
}
function rpc(fn,args,cb){post(SB+'/rest/v1/rpc/'+fn,args,cb);}
function wa(t){return 'https://wa.me/'+(P.wa||'')+'?text='+encodeURIComponent(t);}
var EST={A_COTIZAR:['Calculando el envío','e1'],ESPERANDO_PAGO:['Esperando el pago','e1'],PAGO_INFORMADO:['Verificando tu pago','e2'],PAGADO:['Pago acreditado','e3'],
  PREPARANDO:['Preparando tu pedido','e3'],LISTO:['Listo para retirar','e3'],DESPACHADO:['Despachado','e3'],ENTREGADO:['Entregado','e3'],CANCELADO:['Cancelado','e4']};
function cargar(){
  if(!T){$('m').innerHTML='<div class="box">Falta el código del pedido en el link.</div>';return;}
  rpc('vt_tienda_pedido',{t:T},function(err,r){
    if(err||!r||!r.ok){$('m').innerHTML='<div class="box">'+esc(err||(r&&r.error)||'No encontramos el pedido')+'</div>';return;}
    P=r;pintar();
  });
}
function copiar(t,b){try{navigator.clipboard.writeText(t);b.textContent='Copiado';}catch(e){window.prompt('Copiá el dato:',t);}}
function pintar(){
  var e=EST[P.estado]||[P.estado,'e1'],h='';
  h+='<div class="box"><h2>Pedido '+esc(P.nro)+'</h2><div class="mu">'+fecha(P.fecha)+' · '+esc(P.nombre)+' · '+(P.entrega==='ENVIO'?'Envío a '+esc(P.localidad):'Retiro en el local')+'</div><span class="est '+e[1]+'">'+esc(e[0])+'</span></div>';
  h+='<div class="box"><table>';
  for(var i=0;i<P.items.length;i++){var x=P.items[i];h+='<tr><td>'+x.q+' × '+esc(x.d)+'<div class="mu">'+pesos(x.p)+' c/u</div></td><td class="n">'+pesos(x.p*x.q)+'</td></tr>';}
  h+='</table><table class="tt" style="margin-top:6px"><tr><td>Cubiertas</td><td class="n">'+pesos(P.subtotal)+'</td></tr>';
  if(P.entrega==='ENVIO')h+='<tr><td>Envío'+(P.envio_detalle?' <span class="mu">('+esc(P.envio_detalle)+')</span>':'')+'</td><td class="n">'+(P.estado==='A_COTIZAR'?'a calcular':(P.envio_costo>0?pesos(P.envio_costo):(P.envio_modo==='A'?'a cargo del cliente':'$ 0')))+'</td></tr>';
  h+='<tr class="g"><td>Total</td><td class="n">'+(P.estado==='A_COTIZAR'?'a confirmar':pesos(P.total))+'</td></tr></table><div class="mu" style="margin-top:4px">Precios con IVA incluido.</div></div>';
  h+='<div class="box">'+accion()+'</div>';
  $('m').innerHTML=h;
}
function accion(){
  var t='Hola, te escribo por el pedido '+P.nro+' de la tienda web.';
  if(P.estado==='A_COTIZAR')return '<b>Estamos calculando el costo del envío.</b><p class="mu">Te escribimos por WhatsApp con el total y el link para pagar. No tenés que pagar nada todavía.</p><a class="btn w" target="_blank" rel="noopener" href="'+wa(t)+'">Escribinos por WhatsApp</a>';
  if(P.estado==='ESPERANDO_PAGO'){
    var h='<b>Elegí cómo pagar '+pesos(P.total)+'</b>';
    if(P.mp)h+='<button class="btn o" id="bMp" onclick="pagarMp()">Pagar con Mercado Pago (tarjetas)</button><div class="err" id="eMp"></div>';
    h+='<p style="margin:14px 0 4px"><b>Transferencia bancaria</b></p>';
    if(P.alias||P.cbu){
      if(P.alias)h+='<div class="dato"><div><span>Alias</span><br><b>'+esc(P.alias)+'</b></div><button onclick="copiar(\''+esc(P.alias)+'\',this)">Copiar</button></div>';
      if(P.cbu)h+='<div class="dato"><div><span>CBU / CVU</span><br><b>'+esc(P.cbu)+'</b></div><button onclick="copiar(\''+esc(P.cbu)+'\',this)">Copiar</button></div>';
      h+='<div class="mu" style="margin-top:6px">'+(P.titular?'Titular: '+esc(P.titular)+'. ':'')+(P.banco?'Banco: '+esc(P.banco)+'. ':'')+(P.cuit?'CUIT: '+esc(P.cuit)+'.':'')+'</div>';
      h+='<p class="mu">Cuando transfieras, avisanos acá y mandanos el comprobante por WhatsApp.</p><input id="ref" placeholder="Ej: transferí desde la cuenta de Juan Pérez"><button class="btn" id="bInf" onclick="informar()">Ya transferí</button><div class="err" id="eInf"></div>';
    } else h+='<p class="mu">Te pasamos los datos de la cuenta por WhatsApp.</p>';
    h+='<a class="btn w" target="_blank" rel="noopener" href="'+wa(t+' Quiero pagar '+pesos(P.total)+'.')+'">Escribinos por WhatsApp</a>';
    return h;
  }
  if(P.estado==='PAGO_INFORMADO')return '<b>Recibimos tu aviso de pago.</b><p class="mu">Lo estamos verificando. Si no nos mandaste el comprobante, mandalo por WhatsApp así lo confirmamos más rápido.</p><a class="btn w" target="_blank" rel="noopener" href="'+wa(t+' Te mando el comprobante.')+'">Mandar comprobante</a>';
  if(P.estado==='CANCELADO')return '<b>Este pedido fue cancelado.</b><p class="mu">Si tenés dudas escribinos.</p><a class="btn w" target="_blank" rel="noopener" href="'+wa(t)+'">WhatsApp</a>';
  return '<b>'+(P.entrega==='ENVIO'?'Te avisamos por WhatsApp cuando lo despachamos.':'Te avisamos por WhatsApp cuando esté listo para retirar.')+'</b><a class="btn w" target="_blank" rel="noopener" href="'+wa(t)+'">WhatsApp</a>';
}
function informar(){
  var b=$('bInf');b.disabled=true;
  rpc('vt_tienda_informar_pago',{t:T,ref:$('ref').value},function(err,r){
    b.disabled=false;
    if(err||!r||!r.ok){$('eInf').textContent=err||(r&&r.error)||'No se pudo avisar';return;}
    cargar();
  });
}
function pagarMp(){
  var b=$('bMp');b.disabled=true;b.textContent='Abriendo Mercado Pago…';
  post(SB+'/functions/v1/tienda-mp',{accion:'crear',t:T},function(err,r){
    if(err||!r||!r.ok||!r.url){b.disabled=false;b.textContent='Pagar con Mercado Pago (tarjetas)';$('eMp').textContent=err||(r&&r.error)||'Mercado Pago no respondió';return;}
    location.href=r.url;
  });
}
cargar();
</script>
</body>
</html>
